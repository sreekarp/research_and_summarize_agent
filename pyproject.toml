# Tool settings only; dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv", "reports"]

[tool.ruff.lint]
# Checks that catch real bugs (undefined names, unused imports, likely mistakes) rather than style
select = ["E4", "E7", "E9", "F", "B"]
